name: Fetch Training Videos

on:
  schedule:
    - cron: '0 21 */3 * *'   # 3일에 한 번 · 한국시간 오전 6시(UTC 21:00) — 카테고리별 새 훈련영상 갱신
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch top training videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/fetch_training_videos.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/training-videos.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "훈련 영상 자동 수집: 키워드별 조회수 상위 3개(6개월 이내)"
            git push
          fi
